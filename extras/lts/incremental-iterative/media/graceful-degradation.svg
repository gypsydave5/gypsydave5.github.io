<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tier { fill: #e8f4f8; stroke: #2c5f7f; stroke-width: 2; }
      .tier-best { fill: #4a9eff; }
      .tier-good { fill: #6eb5ff; }
      .tier-ok { fill: #92ccff; }
      .tier-last { fill: #c4e0ff; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .sublabel { font-family: Arial, sans-serif; font-size: 14px; fill: #4a4a4a; font-style: italic; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .steel-thread-label { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #d35400; }
      .steel-thread-highlight { fill: none; stroke: #d35400; stroke-width: 4; stroke-dasharray: 8,4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Steel Thread Highlight Box -->
  <rect x="85" y="170" width="630" height="220" rx="12" class="steel-thread-highlight" />
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Graceful Degradation of Iteration</text>
  
  <!-- Tier 1: External Product Iteration -->
  <rect x="50" y="60" width="700" height="80" rx="8" class="tier tier-best" />
  <text x="400" y="90" text-anchor="middle" class="label">External Product Iteration</text>
  <text x="400" y="115" text-anchor="middle" class="sublabel">Ship to users, learn from real feedback (The Ideal)</text>
  
  <!-- Arrow down -->
  <path d="M 400 145 L 400 175" class="arrow" />
  
  <!-- Tier 2: Internal Product Iteration -->
  <rect x="100" y="180" width="600" height="80" rx="8" class="tier tier-good" />
  <text x="400" y="210" text-anchor="middle" class="label">Internal Product Iteration</text>
  <text x="400" y="235" text-anchor="middle" class="sublabel">Show to team, PO, friendly users - iterate the product</text>
  
  <!-- Arrow down -->
  <path d="M 400 265 L 400 295" class="arrow" />
  
  <!-- Tier 3: Iterating Integration -->
  <rect x="150" y="300" width="500" height="80" rx="8" class="tier tier-ok" />
  <text x="400" y="330" text-anchor="middle" class="label">Iterating Integration</text>
  <text x="400" y="355" text-anchor="middle" class="sublabel">System always wired together, validate connections</text>
  
  <!-- Arrow down -->
  <path d="M 400 385 L 400 415" class="arrow" />
  
  <!-- Tier 4: Pure Incremental -->
  <rect x="200" y="420" width="400" height="80" rx="8" class="tier tier-last" />
  <text x="400" y="450" text-anchor="middle" class="label">Pure Incremental</text>
  <text x="400" y="475" text-anchor="middle" class="sublabel">Last resort - build pieces, hope they fit</text>
  
  <!-- Steel Thread Label -->
  <text x="120" y="165" text-anchor="start" class="steel-thread-label">Steel Thread</text>
</svg>
